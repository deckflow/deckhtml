<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSS animation fixture</title>
<style>
  body { margin: 0; width: 1280px; height: 720px; background: #f5f7fa; font-family: Arial, sans-serif; }
  .slide { position: relative; width: 1280px; height: 720px; }

  @keyframes dhFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes dhFlyLeft {
    0% { opacity: 0; transform: translateX(-240px); }
    100% { opacity: 1; transform: translateX(0); }
  }
  @keyframes dhZoom {
    from { transform: scale(0); }
    to { transform: scale(1); }
  }
  @keyframes dhPulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
  @keyframes dhSpin {
    from { transform: rotate(-180deg); }
    to { transform: rotate(0deg); }
  }

  h1 {
    position: absolute; left: 90px; top: 80px; margin: 0; font-size: 52px; color: #10243a;
    animation: dhFadeIn 0.7s ease-out both;
  }
  .card {
    position: absolute; left: 90px; top: 240px; width: 460px; height: 170px;
    background: #2f7cf6; border-radius: 16px; color: #fff; font-size: 26px;
    display: flex; align-items: center; justify-content: center;
    animation: dhFlyLeft 800ms ease-out 200ms both;
  }
  .badge {
    position: absolute; left: 640px; top: 260px; width: 200px; height: 96px;
    background: #ffb020; border-radius: 48px; color: #10243a; font-size: 22px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    animation: dhZoom 0.5s ease-out both;
  }
  .loop {
    position: absolute; left: 920px; top: 260px; width: 180px; height: 96px;
    background: #d94848; border-radius: 12px; color: #fff; font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    animation: dhPulse 1.2s ease-in-out infinite;
  }
  .rot {
    position: absolute; left: 90px; top: 520px; color: #2f7cf6; font-size: 24px;
    animation: dhSpin 0.9s linear both;
  }
</style>
</head>
<body>
<div class="slide" data-slide-id="css-01">
  <h1 data-element-id="css-title">CSS Animations</h1>
  <div class="card" data-element-id="css-card">Fly + fade from left</div>
  <div class="badge">Zoom badge</div>
  <div class="loop">Infinite pulse (unmapped)</div>
  <p class="rot">Spin in 180°</p>
</div>
</body>
</html>
