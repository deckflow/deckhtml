<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>DH-P0-009 diagnostics fixture</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    .slide {
      width: 1280px;
      height: 720px;
      position: relative;
      background: #fff;
    }
    .title {
      position: absolute;
      left: 80px;
      top: 80px;
      font-size: 48px;
      font-weight: 700;
    }
    .card {
      position: absolute;
      left: 80px;
      top: 220px;
      width: 400px;
      height: 200px;
      background: #eef;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="slide">
    <!-- A well-hinted element: should produce no diagnostic. -->
    <h1 class="title" data-element-id="title" data-pptx-kind="text">Diagnostics</h1>
    <!-- An ambiguous hint: should produce DECKHTML_KIND_AMBIGUOUS. -->
    <div class="card" data-element-id="card" data-pptx-kind="card">Card</div>
  </div>
</body>
</html>
