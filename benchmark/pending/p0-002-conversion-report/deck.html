<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>P0-002 per-element report</title>
<style>
  body { margin: 0; }
  .slide { width: 1280px; height: 720px; position: relative; }
</style>
</head>
<body>
  <section class="slide" data-slide-id="cover">
    <h1 data-element-id="title">Report Title</h1>
    <p data-element-id="body">Report body text.</p>
    <div data-element-id="card" data-pptx-kind="shape">Card</div>
    <div data-element-id="ignored" data-pptx-kind="ignore">Ignored</div>
  </section>
</body>
</html>
